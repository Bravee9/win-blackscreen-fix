<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%">
  <defs>
    <style>
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 14px; fill: #1f2328; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #656d76; }
      .text-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 12px; fill: #1f2328; }
      .step-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 12px; fill: #ffffff; }
      .step-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 13px; fill: #0969da; }
      .card-bg { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; rx: 8; }
      .window-header { fill: #eaeef2; rx: 6; }
      .btn-blue { fill: #0078d4; rx: 4; }
      .btn-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #ffffff; font-weight: 600; }
      .badge-circle { fill: #0969da; }
      @media (prefers-color-scheme: dark) {
        .text-title { fill: #f0f6fc; }
        .text-sub { fill: #8b949e; }
        .text-bold { fill: #f0f6fc; }
        .card-bg { fill: #161b22; stroke: #30363d; }
        .window-header { fill: #21262d; }
        .step-header { fill: #58a6ff; }
        .badge-circle { fill: #1f6feb; }
      }
    </style>
  </defs>

  <!-- Step 1 Card: Windows Explorer -->
  <g transform="translate(15, 20)">
    <rect class="card-bg" width="295" height="340" />
    <circle class="badge-circle" cx="30" cy="30" r="14" />
    <text class="step-badge" x="30" y="34" text-anchor="middle">1</text>
    <text class="step-header" x="55" y="34">STEP 1: Open Installer</text>
    <text class="text-sub" x="20" y="65">Locate downloaded file in Explorer</text>

    <!-- Mini Window -->
    <g transform="translate(15, 80)">
      <rect fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6" width="265" height="230" />
      <path class="window-header" d="M0 6 C0 3, 3 0, 6 0 L259 0 C262 0, 265 3, 265 6 L265 26 L0 26 Z" />
      <circle cx="12" cy="13" r="4" fill="#ff5f56" />
      <circle cx="24" cy="13" r="4" fill="#ffbd2e" />
      <circle cx="36" cy="13" r="4" fill="#27c93f" />
      <text class="text-sub" x="50" y="17" font-size="11">File Explorer - Downloads</text>

      <!-- File Row (Highlighted) -->
      <g transform="translate(10, 45)">
        <rect fill="#e8f2ff" stroke="#a5c8ff" stroke-width="1" rx="4" width="245" height="48" />
        <!-- App Icon -->
        <rect x="10" y="10" width="28" height="28" rx="4" fill="#0078d4" />
        <path d="M16 16 L22 16 L22 22 L16 22 Z M24 16 L30 16 L30 22 L24 22 Z M16 24 L22 24 L22 30 L16 30 Z M24 24 L30 24 L30 30 L24 30 Z" fill="#ffffff" />
        <text class="text-bold" x="46" y="24" font-size="11">WinExplorerAutoFix-Setup.exe</text>
        <text class="text-sub" x="46" y="38" font-size="10">Application - 2,050 KB</text>
      </g>

      <!-- Mouse Pointer & Action -->
      <g transform="translate(180, 110)">
        <path d="M0 0 L14 14 L8 15 L12 24 L8 26 L4 17 L0 20 Z" fill="#1f2328" stroke="#ffffff" stroke-width="1.5" />
      </g>
      <rect x="25" y="160" width="215" height="45" rx="4" fill="#eef3f8" stroke="#cbd5e1" stroke-width="1" />
      <text class="text-bold" x="132" y="180" text-anchor="middle" font-size="11">Double-click to run</text>
      <text class="text-sub" x="132" y="195" text-anchor="middle" font-size="10">No administrator rights required</text>
    </g>
  </g>

  <!-- Step 2 Card: Windows SmartScreen -->
  <g transform="translate(332, 20)">
    <rect class="card-bg" width="295" height="340" />
    <circle class="badge-circle" cx="30" cy="30" r="14" />
    <text class="step-badge" x="30" y="34" text-anchor="middle">2</text>
    <text class="step-header" x="55" y="34">STEP 2: Bypass SmartScreen</text>
    <text class="text-sub" x="20" y="65">Only if Windows shows blue dialog</text>

    <!-- Mini SmartScreen Dialog -->
    <g transform="translate(15, 80)">
      <rect fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6" width="265" height="230" />
      <rect fill="#0078d4" rx="6" width="265" height="45" />
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#ffffff" x="15" y="28">Windows protected your PC</text>

      <g transform="translate(15, 60)">
        <text class="text-sub" x="0" y="15" font-size="10">Microsoft Defender SmartScreen prevented</text>
        <text class="text-sub" x="0" y="28" font-size="10">an unrecognized app from starting.</text>

        <!-- Action 1: More info -->
        <rect x="0" y="45" width="235" height="32" rx="4" fill="#f0f6fc" stroke="#0969da" stroke-width="1" stroke-dasharray="3,3" />
        <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#0969da" x="10" y="65">1. Click "More info"</text>

        <!-- Action 2: Run anyway -->
        <g transform="translate(0, 95)">
          <rect class="btn-blue" x="0" y="0" width="115" height="28" />
          <text class="btn-text" x="57" y="18" text-anchor="middle">2. Run anyway</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Step 3 Card: Finish & Protect -->
  <g transform="translate(650, 20)">
    <rect class="card-bg" width="295" height="340" />
    <circle class="badge-circle" cx="30" cy="30" r="14" />
    <text class="step-badge" x="30" y="34" text-anchor="middle">3</text>
    <text class="step-header" x="55" y="34">STEP 3: Installation &amp; Finish</text>
    <text class="text-sub" x="20" y="65">Automated background setup</text>

    <!-- Mini Wizard Dialog -->
    <g transform="translate(15, 80)">
      <rect fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6" width="265" height="230" />
      <path class="window-header" d="M0 6 C0 3, 3 0, 6 0 L259 0 C262 0, 265 3, 265 6 L265 26 L0 26 Z" />
      <text class="text-sub" x="15" y="17" font-size="11">Win Explorer AutoFix Setup</text>

      <g transform="translate(15, 45)">
        <text class="text-bold" x="0" y="15" font-size="12">Setup Wizard</text>
        <text class="text-sub" x="0" y="32" font-size="10">Configures automated background</text>
        <text class="text-sub" x="0" y="45" font-size="10">recovery for explorer.exe shell.</text>

        <!-- Install Button -->
        <g transform="translate(50, 70)">
          <rect class="btn-blue" width="135" height="32" />
          <text class="btn-text" x="67" y="20" text-anchor="middle">Click "Install"</text>
        </g>

        <!-- Status Result -->
        <g transform="translate(0, 125)">
          <rect fill="#dafbe1" stroke="#4ac26b" stroke-width="1" rx="4" width="235" height="42" />
          <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#1a7f37" x="117" y="18" text-anchor="middle">Setup Completed</text>
          <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#1a7f37" x="117" y="32" text-anchor="middle">Auto-starts silently with Windows</text>
        </g>
      </g>
    </g>
  </g>
</svg>
